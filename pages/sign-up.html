<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a Stackly workspace account." />
    <title>Create account | Stackly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script defer src="../assets/js/shared.js"></script>
  </head>
  <body class="auth-page">
    <div class="site-loader" id="siteLoader" role="status" aria-live="polite">
      <img src="../assets/images/logoStackly.webp" alt="" /><span
        class="loader-spinner"
      ></span
      ><span>Loading Stackly</span>
    </div>
    <main class="auth-shell auth-shell-register">
      <section class="auth-story">
        <a class="brand" href="../index.html"
          ><img src="../assets/images/logoStackly.webp" alt="Stackly"
        /></a>
        <div>
          <div class="eyebrow">
            <span class="eyebrow-line"></span> Build what's next
          </div>
          <h1>
            A better way<br />to
            <span class="gradient-text">move forward.</span>
          </h1>
          <p>
            Bring your team, technology, and momentum into one focused
            workspace.
          </p>
        </div>
        <div class="auth-trust">
          <span><i class="fa-solid fa-check"></i> Free workspace</span
          ><span><i class="fa-solid fa-lock"></i> Private by default</span>
        </div>
      </section>
      <section class="auth-form-wrap">
        <div class="auth-topline">
          <a href="../index.html"
            ><i class="fa-solid fa-arrow-left"></i>&nbsp;&nbsp;&nbsp;Back to
            Home</a
          >
        </div>
        <form class="auth-form" id="signUpForm" novalidate>
          <div class="form-heading">
            <span>Create your account</span
            ><small>Start your Stackly workspace in a minute.</small>
          </div>
          <div class="form-two">
            <div class="form-group">
              <label for="firstName">First name <b>*</b></label>
              <input
                id="firstName"
                type="text"
                required
                autocomplete="given-name"
                placeholder="First name"
              />
              <small class="field-error"></small>
            </div>
            <div class="form-group">
              <label for="lastName">Last name <b>*</b></label>
              <input
                id="lastName"
                type="text"
                required
                autocomplete="family-name"
                placeholder="Last name"
              />
              <small class="field-error"></small>
            </div>
          </div>
          <div class="form-group">
            <label for="signupEmail">Email address <b>*</b></label>
            <input
              id="signupEmail"
              type="email"
              required
              autocomplete="email"
              placeholder="you@company.com"
            />
            <small class="field-error"></small>
          </div>
          <div class="form-group">
            <label for="signupPhone">Mobile number <b>*</b></label>
            <div class="phone-input-group">
              <select
                id="signupCountryCode"
                name="countryCode"
                aria-label="Country Code"
              >
                <option value="+1">+1 (US/CA)</option>
                <option value="+44">+44 (UK)</option>
                <option value="+91" selected>+91 (IN)</option>
                <option value="+61">+61 (AU)</option>
                <option value="+49">+49 (DE)</option>
                <option value="+33">+33 (FR)</option>
                <option value="+81">+81 (JP)</option>
                <option value="+65">+65 (SG)</option>
                <option value="+971">+971 (UAE)</option>
              </select>
              <input
                id="signupPhone"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                required
                autocomplete="tel-national"
                placeholder="10-digit number"
              />
            </div>
            <small class="field-error"></small>
          </div>
          <div class="form-group">
            <label for="signupPassword">Password <b>*</b></label>
            <div class="password-container">
              <input
                id="signupPassword"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="At least 8 chars, 1 uppercase, 1 number"
              />
              <button
                type="button"
                class="toggle-eye"
                id="signupToggleEye"
                aria-label="Show password"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <small class="field-error"></small>
          </div>
          <div class="form-group">
            <label for="signupConfirmPassword">Confirm password <b>*</b></label>
            <div class="password-container">
              <input
                id="signupConfirmPassword"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="Re-enter your password"
              />
              <button
                type="button"
                class="toggle-eye"
                id="signupConfirmToggleEye"
                aria-label="Show password"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <small class="field-error"></small>
          </div>
          <div class="form-group">
            <label for="signupRole">Role <b>*</b></label>
            <select id="signupRole" required>
              <option value="">Choose a role</option>
              <option value="Admin">Admin</option>
              <option value="Manager">Manager</option>
              <option value="Employee">Employee</option>
              <option value="Customer">Customer</option>
            </select>
            <small class="field-error"></small>
          </div>
          <div class="form-group check-group">
            <label class="check-row">
              <input id="terms" type="checkbox" required />
              <span
                >I agree to the <a href="../404.html">Terms of Use</a> and
                Privacy Policy. <b>*</b></span
              >
            </label>
            <small class="field-error"></small>
          </div>
          <button class="button button-primary" type="submit">
            Create account <i class="fa-solid fa-arrow-right"></i>
          </button>
          <p class="form-status" id="authStatus" role="status"></p>
          <p class="auth-switch">
            Already registered? <a href="sign-in.html">Sign in</a>
          </p>
        </form>
      </section>
    </main>
    <script defer src="../assets/js/auth.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stackly enterprise workspace gateway router."
    />
    <title>Workspace | Stackly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script defer src="../assets/js/shared.js"></script>
    <script>
      // Immediate pre-render redirect to avoid flash of content
      (function () {
        try {
          var raw = localStorage.getItem("stackly_session");
          if (!raw) {
            window.location.replace("sign-in.html");
            return;
          }
          var sess = JSON.parse(raw);
          var role = (sess.role || "Admin").toLowerCase();
          if (role === "manager") {
            window.location.replace("dashboard-manager.html");
          } else if (role === "employee") {
            window.location.replace("dashboard-employee.html");
          } else if (role === "customer") {
            window.location.replace("dashboard-customer.html");
          } else {
            window.location.replace("dashboard-admin.html");
          }
        } catch (e) {
          window.location.replace("sign-in.html");
        }
      })();
    </script>
  </head>
  <body class="dashboard-page">
    <div class="site-loader" id="siteLoader" role="status" aria-live="polite">
      <img src="../assets/images/logoStackly.webp" alt="" />
      <span class="loader-spinner"></span>
      <span>Routing to dedicated role workspace...</span>
    </div>
    <header class="dashboard-header">
      <a class="brand" href="../index.html">
        <img src="../assets/images/logoStackly.webp" alt="Stackly" />
      </a>
      <div class="dashboard-user">
        <span class="user-avatar" id="userAvatar">S</span>
        <span>
          <strong id="userName">Stackly User</strong>
          <small id="userRole">Authenticating...</small>
        </span>
        <button
          class="button button-small button-ghost"
          id="signOut"
          type="button"
        >
          Sign out
        </button>
      </div>
    </header>
    <main class="dashboard-main" id="main-content">
      <div
        class="dashboard-heading"
        style="
          text-align: center;
          display: block;
          margin: 60px auto;
          max-width: 600px;
        "
      >
        <div class="site-loader-inline" style="margin-bottom: 24px">
          <span
            class="loader-spinner"
            style="
              display: inline-block;
              width: 44px;
              height: 44px;
              border: 3px solid rgba(45, 212, 191, 0.2);
              border-top-color: var(--cyan);
              border-radius: 50%;
              animation: spin 0.8s linear infinite;
            "
          ></span>
        </div>
        <div class="eyebrow" style="justify-content: center">
          <span class="eyebrow-line"></span>
          <span>Role Gateway</span>
        </div>
        <h1>Opening your <span class="gradient-text">workspace...</span></h1>
        <p style="margin: 16px auto; color: var(--muted); font-size: 1.05rem">
          Detecting authenticated credentials and loading your role-specific
          enterprise dashboard.
        </p>
      </div>
    </main>
    <footer class="footer inner-footer"></footer>
    <script defer src="../assets/js/dashboard.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Stackly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script defer src="assets/js/shared.js"></script>
    <script defer src="assets/js/shared-shell.js"></script>
  </head>
  <body class="error-page">
    <div class="site-loader" id="siteLoader" role="status" aria-live="polite">
      <img src="assets/images/logoStackly.webp" alt="" /><span
        class="loader-spinner"
      ></span
      ><span>Loading Stackly</span>
    </div>
    <header class="inner-header"></header>
    <main class="error-content">
      <a class="brand" href="index.html" aria-label="Stackly home"
        ><img src="assets/images/logoStackly.webp" alt="Stackly"
      /></a>
      <div class="error-code">404</div>
      <h1>Page not found.</h1>
      <p>
        The destination you followed is not available yet. Return to Stackly and
        keep exploring.
      </p>
      <div class="error-actions">
        <button
          type="button"
          class="button button-ghost"
          id="goBackBtn"
          onclick="
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.location.href = 'index.html';
            }
          "
        >
          <i class="fa-solid fa-arrow-left"></i> Go back
        </button>
        <a class="button button-primary" href="index.html">Go to home</a>
      </div>
      <nav class="error-links" aria-label="Helpful links">
        <a href="pages/services.html">Services</a
        ><a href="pages/about.html">About</a><a href="pages/blog.html">Blog</a
        ><a href="pages/contact.html">Contact</a>
      </nav>
    </main>
    <footer class="footer inner-footer"></footer>
    <script>
      document
        .querySelector("#errorSearch")
        ?.addEventListener("submit", (event) => {
          event.preventDefault();
          window.location.href = "index.html#services";
        });
    </script>
  </body>
</html>
